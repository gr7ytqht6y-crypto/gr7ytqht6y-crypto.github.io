;width:100%;border-radius:12px 12px 0 0;padding:20px;max-height:90vh;overflow-y:auto}.modal-header{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}.modal-close{cursor:pointer;font-size:24px;line-height:1}.screen{display:none}.screen.active{display:block}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:100}.action-btn{flex:1;padding:12px;text-align:center;font-size:13px;cursor:pointer;border:none;background:none;font-weight:600;color:#666}.action-btn:active{opacity:.6}.action-btn.active{color:#000}.screen.show-nav{padding-bottom:60px}.profile-header{padding:20px;background:#f5f5f5;border-radius:8px;margin-bottom:20px;position:relative}.avatar-wrapper{width:80px;height:80px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;position:relative;cursor:pointer;margin-bottom:12px}.avatar-wrapper img{width:100%;height:100%;object-fit:cover}.avatar-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px}.avatar-edit-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;opacity:0}.avatar-wrapper:active .avatar-edit-overlay{opacity:1}.profile-username{font-size:18px;font-weight:700;margin-bottom:6px}.profile-meta{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.lvl-badge,.founder-badge,.username-badge{padding:4px 8px;background:#000;color:#fff;border-radius:4px;font-size:12px;font-weight:600}.founder-badge{background:#e74c3c}.profile-status{font-size:13px;color:#666;margin-top:8px}.profile-date{font-size:12px;color:#999;margin-top:8px}.profile-founder-tag{font-size:11px;color:#e74c3c;font-weight:700;margin-top:6px}.profile-account-num{font-size:11px;color:#999;margin-top:6px}.nft-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.nft-card{cursor:pointer}.nft-card-bg{border-radius:8px;padding:12px;position:relative;aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between}.nft-rarity{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);margin-bottom:6px}.nft-img{width:90px;height:90px;object-fit:contain;margin:8px 0 6px;align-self:center}.nft-name{font-weight:700;font-size:13px;margin-top:6px;color:#000}.nft-price{font-size:12px;color:#000;margin-top:4px;font-weight:600}.nft-actions{display:flex;flex-direction:column;gap:6px;margin-top:8px}.nft-detail-img{width:160px;height:160px;object-fit:contain;display:block;margin:0 auto 14px}.nft-image-wrap .nft-img{margin:0}.nft-placeholder{display:none;width:100%;height:100%;background:#eee;align-items:center;justify-content:center;color:#999;font-size:12px}.rarity-common{background:#a0a0a0 !important}.rarity-rare{background:#4a90e2 !important}.rarity-epic{background:#9b59b6 !important}.rarity-mythic{background:#f39c12 !important}.rarity-legendary{background:#e74c3c !important}.nft-instance{font-size:12px;color:#666;margin-top:4px}.nft-owners{font-size:12px;color:#999;margin-top:2px}.nft-detail-box{background:#f9f9f9;border-radius:8px;padding:16px;margin-bottom:16px;display:flex;flex-direction:column;align-items:center}.nft-detail-title{font-size:18px;font-weight:700;margin-top:12px}.summary-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-size:14px}.summary-row span{color:#666}.summary-row strong{color:#000;font-weight:600}.nft-detail-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}.transaction-item{padding:12px;background:#f9f9f9;border-radius:6px;margin-bottom:8px;font-size:13px}.transaction-from{color:#666;font-size:12px}.transaction-amount{font-weight:700;color:#000;margin:6px 0}.transaction-date{color:#999;font-size:11px}.listing-card{paddi <body>

<div id="app">
  <div id="login-screen" class="screen active show-nav">
    <div class="container">
      <h2 style="text-align:center;margin-top:40px">AEGIS</h2>
      <form class="form" id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Логин</label>
          <input type="text" id="login-username" placeholder="@username" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <div id="login-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-full" id="btn-login">Войти</button>
      </form>
      <div class="link" style="text-align:center;margin-top:16px"><a onclick="showScreen('register')">Создать аккаунт</a></div>
      <div class="link" style="text-align:center;margin-top:8px"><a onclick="showScreen('recovery')">Забыли пароль?</a></div>
    </div>
  </div>

  <div id="register-screen" class="screen show-nav">
    <div class="container">
      <h2>Создать аккаунт</h2>
      <form class="form" id="form-register" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Логин</label>
          <input type="text" id="reg-username" placeholder="@username" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="reg-password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>Повторите пароль</label>
          <input type="password" id="reg-password2" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>Код восстановления (сохраните!)</label>
          <input type="text" id="reg-recovery" readonly style="cursor:pointer" placeholder="Нажмите для генерации">
        </div>
        <div id="reg-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-full">Создать</button>
        <div class="link" style="text-align:center;margin-top:12px"><a onclick="showScreen('login')">Уже есть аккаунт?</a></div>
      </form>
    </div>
  </div>

  <div id="recovery-screen" class="screen show-nav">
    <div class="container">
      <h2>Восстановление доступа</h2>
      <form class="form" id="form-recovery" onsubmit="handleRecovery(event)">
        <div class="form-group">
          <label>Логин</label>
          <input type="text" id="recovery-username" placeholder="@username" required>
        </div>
        <div class="form-group">
          <label>Код восстановления</label>
          <input type="text" id="recovery-code" placeholder="..." required>
        </div>
        <div class="form-group">
          <label>Новый пароль</label>
          <input type="password" id="recovery-password" placeholder="••••••••" required>
        </div>
        <div id="recovery-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-full">Восстановить</button>
        <div class="link" style="text-align:center;margin-top:12px"><a onclick="showScreen('login')">Назад</a></div>
      </form>
    </div>
  </div>

  <div id="main-screen" class="screen show-nav">
    <div class="container">
      <div id="main-content"></div>
    </div>
  </div>

  <div id="nft-store-screen" class="screen show-nav">
    <div class="container">
      <h2 style="font-size:20px;font-weight:700;margin-bottom:14px">NFT Store</h2>
      <div id="nft-store-grid" class="nft-grid"></div>
    </div>
  </div>

  <div id="my-nfts-screen" class="screen show-nav">
    <div class="container">
      <h2>Мои NFT</h2>
      <div id="my-nfts-list"></div>
    </div>
  </div>

  <div id="marketplace-screen" class="screen show-nav">
    <div class="container">
      <h2>Маркетплейс</h2>
      <div id="marketplace-list"></div>
    </div>
  </div>

  <div id="auctions-screen" class="screen show-nav">
    <div class="container">
      <h2>Аукционы</h2>
      <div id="auctions-list"></div>
    </div>
  </div>

  <div id="nft-detail-screen" class="screen show-nav">
    <div class="container">
      <button class="btn btn-outline btn-full" style="margin-bottom:16px" onclick="goBack()">← Назад</button>
      <div id="nft-detail-content"></div>
    </div>
  </div>

  <div id="profile-screen" class="screen show-nav">
    <div class="container">
      <div id="profile-header-container"></div>
      <h3>Username'ы</h3>
      <div id="profile-usernames"></div>
      <button class="btn btn-full" id="buy-username-btn" style="margin-top:16px" onclick="showScreen('buy-username')">+ Купить username — 6000 AGS</button>
    </div>
  </div>

  <div id="tap-screen" class="screen show-nav">
    <div class="container">
      <h2 style="text-align:center">Tap</h2>
      <button class="tap-btn" id="tap-button" onclick="handleTap()">👆</button>
      <div class="tap-counter"><span id="tap-count">0</span> тапов сегодня</div>
      <div class="tap-streak" id="tap-streak"></div>
    </div>
  </div>

  <div id="founder-screen" class="screen show-nav">
    <div class="container">
      <h2>Founder Dashboard</h2>
      <div id="founder-content"></div>
    </div>
  </div>

  <div id="qr-screen" class="screen show-nav">
    <div class="container">
      <h2>QR Code</h2>
      <div id="qr-code" style="text-align:center;margin:40px 0"></div>
      <div id="qr-username" style="text-align:center;font-weight:700;font-size:14px;margin-top:20px"></div>
    </div>
  </div>

  <div id="balance-screen" class="screen show-nav">
    <div class="container">
      <h2>Кошелек</h2>
      <div id="balance-content"></div>
    </div>
  </div>

  <div id="transfer-screen" class="screen show-nav">
    <div class="container">
      <h2>Отправить</h2>
      <form class="form" id="form-transfer" onsubmit="handleTransferPreview(event)">
        <div class="form-group">
          <label>Кому</label>
          <input type="text" id="tr-to" placeholder="@username" required>
        </div>
        <div class="form-group">
          <label>Сумма AGS</label>
          <input type="number" id="tr-amount" placeholder="0" required>
        </div>
        <div class="form-group">
          <label>Комментарий (опционально)</label>
          <textarea id="tr-comment" placeholder="..."></textarea>
        </div>
        <div id="tr-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-full">Проверить</button>
      </form>
    </div>
  </div>

  <div id="history-screen" class="screen show-nav">
    <div class="container">
      <h2>История</h2>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="buy-username-screen" class="screen show-nav">
    <div class="container">
      <h2>Купить username</h2>
      <form class="form" id="form-buy-username" onsubmit="handleBuyUsername(event)">
        <div class="form-group">
          <label>Желаемый username</label>
          <input type="text" id="buy-username" placeholder="@username" required>
        </div>
        <div id="buy-error" class="error" style="display:none"></div>
        <button type="submit" class="btn btn-full" id="buy-username-submit">Купить</button>
      </form>
    </div>
  </div>

  <div id="bottom-nav" class="bottom-nav">
    <button class="action-btn active" onclick="showScreen('main')">Главная</button>
    <button class="action-btn" onclick="showScreen('nft-store');refreshNftStore()">NFT</button>
    <button class="action-btn" onclick="showScreen('balance');refreshBalance()">Баланс</button>
    <button class="action-btn" onclick="showScreen('profile');refreshProfile()">Профиль</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(typeof supabase==='undefined'){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\\/script>')}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const SUPABASE_URL = 'https://etxrbcfxkcumvedivusr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0eHJiY2Z4a2N1bXZlZGl2dXNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTQxNTA4MTAsImV4cCI6MjAwOTcyNjgxMH0.sb_publishable_7OkqftdOHRyTyIQP_mf-9A_SPdnYb1U';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const RARITY_CLASS = {'Common':'rarity-common','Rare':'rarity-rare','Epic':'rarity-epic','Mythic':'rarity-mythic','Legendary':'rarity-legendary'};
const RARITY_COLORS = {'Common':'#a0a0a0','Rare':'#4a90e2','Epic':'#9b59b6','Mythic':'#f39c12','Legendary':'#e74c3c'};
let nftLoginUsername = '';
let nftLoginPassword = '';
let nftSessionMemory = null;
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return 'h_'+Math.abs(h).toString(36)+'_'+s.length}
function generateRecoveryCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<32;i++)r+=c[Math.floor(Math.random()*c.length)];return r}
function generateTxId(){const c='0123456789ABCDEF';let id='AEG-';for(let i=0;i<8;i++)id+=c[Math.floor(Math.random()*c.length)];return id}
function escapeHtml(t){const m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return String(t).replace(/[&<>"']/g,c=>m[c])}
function toast(t){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:6px;z-index:999;font-size:14px;max-width:90vw';document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
function showError(id,msg){const e=document.getElementById(id);if(e){e.textContent=msg;e.style.display='block'}}
function hideError(id){const e=document.getElementById(id);if(e)e.style.display='none'}
function getNftSession(){return localStorage.getItem('aegis_nft_session')}
function setNftSession(token){if(token)localStorage.setItem('aegis_nft_session',token);else localStorage.removeItem('aegis_nft_session')}
async function ensureNftSession(){const token=getNftSession();if(token){nftSessionMemory=token;return true}if(!nftLoginUsername||!nftLoginPassword)return false;try{const res=await fetch(SUPABASE_URL+'/functions/v1/aegis-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:nftLoginUsername,password:nftLoginPassword})});if(!res.ok)return false;const data=await res.json();if(data.token){setNftSession(data.token);nftSessionMemory=data.token;return true}}catch(e){}return false}
async function nftApi(action,body={}){if(!await ensureNftSession())throw new Error('NFT сессия потеряна');const token=getNftSession();const res=await fetch(SUPABASE_URL+'/functions/v1/nft-api',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action,...body})});if(!res.ok){const err=await res.json();throw new Error(err.error||'API error')}return await res.json()}
function nftErrorMessage(e){const msg=String(e.message);if(msg.includes('insufficient_balance'))return 'Недостаточно AGS';if(msg.includes('not_owner'))return 'Вы не владелец этого NFT';if(msg.includes('not_found'))return 'NFT не найден';if(msg.includes('unauthorized'))return 'Требуется авторизация';if(msg.includes('auction'))return 'Ошибка аукциона';return msg}
function formatAGS(n){return n.toLocaleString('ru')}
function formatNftDate(d){return new Date(d).toLocaleDateString('ru')}
function nftImagePath(n){return n.image_path||('assets/nfts/'+n.image)}
function nftImageHtml(n,cls='nft-img'){const src=escapeHtml(nftImagePath(n)),alt=escapeHtml(n.name);return `<div class="nft-image-wrap"><img class="${cls}" src="${src}" alt="${alt}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="nft-placeholder" style="display:none">NFT</div></div>`}
async function refreshNftStore(){const grid=document.getElementById('nft-store-grid');if(!grid)return;try{const rows=await nftApi('catalog');grid.innerHTML=(rows||[]).map(n=>`<div class="nft-card"><div class="nft-card-bg ${RARITY_CLASS[n.rarity]||''}" style="background-color:${RARITY_COLORS[n.rarity]||'#ccc'}!important"><div class="nft-rarity">${escapeHtml(n.rarity)}</div>${nftImageHtml(n)}<div class="nft-name">${escapeHtml(n.name)}</div><div class="nft-price">${formatAGS(n.price)} AGS</div><div class="nft-actions"><button class="btn btn-outline btn-full btn-sm" onclick="buyNft('${escapeHtml(n.id)}',this)">Купить</button><button class="btn btn-outline btn-full btn-sm" onclick="buyNftGift('${escapeHtml(n.id)}')">Подарить</button></div></div></div>`).join('')}catch(e){grid.innerHTML=`<div class="empty-state">${escapeHtml(nftErrorMessage(e))}</div>`}}
async function buyNft(catalogId,btn){if(btn)btn.disabled=true;try{if(!await getCurrentUser())throw new Error('Войдите в аккаунт');await nftApi('purchase',{catalog_id:catalogId});toast('NFT куплен!');await refreshMain();await refreshNftStore()}catch(e){toast(nftErrorMessage(e))}finally{if(btn)btn.disabled=false}}
async function buyNftGift(catalogId){const username=prompt('Чей username?');if(!username){return}try{await nftApi('purchase_gift',{catalog_id:catalogId,recipient_username:username});toast('NFT подарен!');await refreshNftStore()}catch(e){toast(nftErrorMessage(e))}}
async function refreshMyNfts(){const cont=document.getElementById('my-nfts-list');if(!cont)return;try{const data=await nftApi('my_nfts');if(!data||!data.length){cont.innerHTML='<div class="empty-state">У вас пока нет NFT</div>';return}cont.innerHTML=data.map(item=>{const n=item.nft_catalog;if(!n)return'';const gifted=item.acquired_type==='gift';return `<div class="nft-card" style="margin-bottom:12px" onclick="openNftDetail('${item.id}')"><div class="nft-card-bg ${RARITY_CLASS[n.rarity]||''}" style="background-color:${RARITY_COLORS[n.rarity]||'#ccc'}!important"><div class="nft-rarity">${escapeHtml(n.rarity)}</div>${nftImageHtml(n)}<div class="nft-name">${escapeHtml(n.name)}</div><div class="nft-price">${formatAGS(n.price)} AGS</div><div class="nft-instance">Instance #${item.instance_number||'?'}</div>${gifted?'<div class="nft-instance" style="color:#e74c3c">Получен в подарок</div>':''}</div></div>`}).join('')}catch(e){cont.innerHTML=`<div class="empty-state">${escapeHtml(nftErrorMessage(e))}</div>`}}
async function openNftDetail(instanceId){try{const item=await nftApi('detail',{instance_id:instanceId});const n=item.nft_catalog;if(!n)return;const isOwner=item.owner_id===(await getCurrentUser()).id;document.getElementById('nft-detail-content').innerHTML=`<div class="nft-detail-box ${RARITY_CLASS[n.rarity]||''}" style="background-color:${RARITY_COLORS[n.rarity]||'#ccc'}!important"><div class="nft-rarity">${escapeHtml(n.rarity)}</div>${nftImageHtml(n,'nft-detail-img')}<div class="nft-detail-title">${escapeHtml(n.name)}</div><div class="nft-price">${formatAGS(n.price)} AGS</div></div><div class="summary-row"><span>Instance</span><strong>#${item.instance_number||'?'}</strong></div><div class="summary-row"><span>Статус</span><strong>${item.status==='owned'?'Во владении':item.status==='for_sale'?'На продаже':'На аукционе'}</strong></div><div class="summary-row"><span>Дата покупки</span><strong>${formatNftDate(item.acquired_at)}</strong></div>${isOwner?`<div class="nft-detail-actions"><button class="btn btn-full" onclick="sellNft('${item.id}')">Выставить на продажу</button><button class="btn btn-outline btn-full" onclick="giftNft('${item.id}')">Подарить</button><button class="btn btn-outline btn-full" onclick="auctionNft('${item.id}')">Аукцион</button></div>`:''}`;showScreen('nft-detail')}catch(e){toast(nftErrorMessage(e))}}
function openMyNft(id){openNftDetail(id)}
async function sellNft(instanceId){const price=prompt('Цена в AGS (минимум 50):');if(!price)return;try{await nftApi('list',{instance_id:instanceId,price:parseInt(price)});toast('NFT выставлен на продажу');await refreshMyNfts();showScreen('my-nfts')}catch(e){toast(nftErrorMessage(e))}}
async function giftNft(instanceId){const username=prompt('Чей username?');if(!username)return;try{await nftApi('gift',{instance_id:instanceId,recipient_username:username});toast('NFT подарен!');await refreshMyNfts();showScreen('my-nfts')}catch(e){toast(nftErrorMessage(e))}}
async function auctionNft(instanceId){const start=prompt('Начальная цена в AGS:');if(!start)return;const hours=prompt('Длительность в часах (24):');try{await nftApi('create_auction',{instance_id:instanceId,start_price:parseInt(start),duration_hours:parseInt(hours)||24});toast('Аукцион создан');await refreshMyNfts();showScreen('my-nfts')}catch(e){toast(nftErrorMessage(e))}}
async function refreshMarketplace(){const cont=document.getElementById('marketplace-list');if(!cont)return;try{const data=await nftApi('marketplace');if(!data||!data.length){cont.innerHTML='<div class="empty-state">Нет предложений</div>';return}cont.innerHTML=data.map(l=>{const n=l.nft?.nft_catalog;if(!n)return'';return `<div class="listing-card"><div style="display:flex;justify-content:space-between;align-items:start"><div><div class="listing-seller">${escapeHtml(l.seller?.username||'?')}</div><div class="nft-name">${escapeHtml(n.name)} #${l.nft.instance_number}</div><div class="nft-rarity">${n.rarity}</div></div><div>${nftImageHtml(n,'nft-img')}</div></div><div class="listing-price">${formatAGS(l.price)} AGS</div><button class="btn btn-full btn-sm" onclick="buyListing('${l.id}')">Купить</button></div>`}).join('')}catch(e){cont.innerHTML=`<div class="empty-state">${escapeHtml(nftErrorMessage(e))}</div>`}}
async function buyListing(listingId){try{await nftApi('buy_listing',{listing_id:listingId});toast('NFT куплен!');await refreshMarketplace()}catch(e){toast(nftErrorMessage(e))}}
async function refreshAuctions(){const cont=document.getElementById('auctions-list');if(!cont)return;try{const data=await nftApi('auctions');if(!data||!data.length){cont.innerHTML='<div class="empty-state">Нет активных аукционов</div>';return}cont.innerHTML=data.map(a=>{const n=a.nft?.nft_catalog;if(!n)return'';const endsIn=new Date(a.ends_at).getTime()-Date.now();const hoursLeft=Math.floor(endsIn/(60*60*1000));return `<div class="auction-card"><div class="nft-name">${escapeHtml(n.name)} #${a.nft.instance_number}</div><div class="nft-rarity">${n.rarity}</div><div class="auction-bid">Ставка: ${formatAGS(a.current_bid)} AGS</div><div class="auction-bidder">Продавец: ${escapeHtml(a.seller?.username||'?')}</div>${a.bidder?`<div class="auction-bidder">Текущий лидер: ${escapeHtml(a.bidder.username)}</div>`:''}<div class="auction-ends">Осталось ${hoursLeft}ч</div><button class="btn btn-full btn-sm" onclick="placeBid('${a.id}',${a.current_bid})">Поставить ставку</button></div>`}).join('')}catch(e){cont.innerHTML=`<div class="empty-state">${escapeHtml(nftErrorMessage(e))}</div>`}}
async function placeBid(auctionId,currentBid){const amount=prompt(`Ставка выше ${formatAGS(currentBid)} AGS:`);if(!amount)return;try{await nftApi('bid',{auction_id:auctionId,amount:parseInt(amount)});toast('Ставка принята!');await refreshAuctions()}catch(e){toast(nftErrorMessage(e))}}
async function handleLogin(e){e.preventDefault();const un=document.getElementById('login-username').value.trim();const pw=document.getElementById('login-password').value.trim();hideError('login-error');if(!un||!pw)return showError('login-error','Заполните все поля');try{const clean=un.replace('@','').toLowerCase();const user=await findUserByUsername(un);if(!user)return showError('login-error','Пользователь не найден');if(hash(pw)!==user.password_hash)return showError('login-error','Неверный пароль');nftLoginUsername=clean;nftLoginPassword=pw;if(!await ensureNftSession())return showError('login-error','Ошибка создания сессии');localStorage.setItem('aegis_session',user.id);await refreshMain();showScreen('main')}catch(e){showError('login-error',e.message||'Ошибка входа')}}
async function handleRegister(e){e.preventDefault();const un=document.getElementById('reg-username').value.trim();const pw=document.getElementById('reg-password').value.trim();const pw2=document.getElementById('reg-password2').value.trim();hideError('reg-error');if(!un||!pw||!pw2)return showError('reg-error','Заполните все поля');if(pw!==pw2)return showError('reg-error','Пароли не совпадают');if(pw.length<6)return showError('reg-error','Пароль минимум 6 символов');const recovery=document.getElementById('reg-recovery').value;if(!recovery)return showError('reg-error','Сгенерируйте код восстановления');try{const clean=un.replace('@','').toLowerCase();const hash_val=hash(pw);const recovery_hash=hash(recovery);const{data:newUser,error}=await sb.from('users').insert({username:clean,password_hash:hash_val,recovery_code_hash:recovery_hash,is_founder:false,level:1,xp:0}).select().single();if(error)return showError('reg-error','Ошибка: '+error.message);await sb.from('wallets').insert({user_id:newUser.id,balance:2000});await sb.from('usernames').insert({user_id:newUser.id,username:clean,is_primary:true,category:'legendary'});localStorage.setItem('aegis_temp_user',newUser.id);showError('reg-error','Аккаунт создан! Логин: '+recovery,true);await new Promise(r=>setTimeout(r,2000));showScreen('login')}catch(e){showError('reg-error',e.message)}}
async function handleRecovery(e){e.preventDefault();const un=document.getElementById('recovery-username').value.trim();const code=document.getElementById('recovery-code').value.trim();const pw=document.getElementById('recovery-password').value.trim();hideError('recovery-error');if(!un||!code||!pw)return showError('recovery-error','Заполните все поля');try{const clean=un.replace('@','').toLowerCase();const user=await findUserByUsername(un);if(!user)return showError('recovery-error','Пользователь не найден');if(hash(code)!==user.recovery_code_hash)return showError('recovery-error','Неверный код восстановления');if(pw.length<6)return showError('recovery-error','Пароль минимум 6 символов');const new_hash=hash(pw);await sb.from('users').update({password_hash:new_hash}).eq('id',user.id);showError('recovery-error','Пароль изменён!',true);await new Promise(r=>setTimeout(r,2000));showScreen('login')}catch(e){showError('recovery-error',e.message)}}
async function findUserByUsername(u){const clean=u.replace('@','').toLowerCase();const{data:un,error:unErr}=await sb.from('usernames').select('*').ilike('username',clean).maybeSingle();if(unErr)throw new Error('Ошибка запроса usernames: '+unErr.message);if(!un)return null;const{data:user,error:userErr}=await sb.from('users').select('*').eq('id',un.user_id).single();if(userErr)throw new Error('Ошибка запроса users: '+userErr.message);return user}
async function getCurrentUser(){const id=localStorage.getItem('aegis_session');if(!id)return null;const{data:user}=await sb.from('users').select('*').eq('id',id).single();return user||null}
async function getPrimaryUsername(userId){const{data:un}=await sb.from('usernames').select('*').eq('user_id',userId).eq('is_primary',true).single();return un}
async function getUserUsernames(userId){const{data:uns}=await sb.from('usernames').select('*').eq('user_id',userId);return uns||[]}
async function showScreen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const s=document.getElementById(name+'-screen');if(s){s.classList.add('active');if(['nft-store','my-nfts','marketplace','auctions','balance','profile'].includes(name)){if(name==='nft-store')await refreshNftStore();else if(name==='my-nfts')await refreshMyNfts();else if(name==='marketplace')await refreshMarketplace();else if(name==='auctions')await refreshAuctions();else if(name==='balance')await refreshBalance();else if(name==='profile')await refreshProfile()}}updateNavigation(name)}
function updateNavigation(name){document.querySelectorAll('.action-btn').forEach((b,i)=>{b.classList.remove('active');if((i===0&&name==='main')||(i===1&&name==='nft-store')||(i===2&&name==='balance')||(i===3&&name==='profile'))b.classList.add('active')})}
function goBack(){showScreen('main')}
async function refreshMain(){const user=await getCurrentUser();if(!user){showScreen('login');return}const cont=document.getElementById('main-content');if(cont){cont.innerHTML=`<h2>Привет, @${escapeHtml(user.username)}!</h2><div style="margin-top:20px;padding:16px;background:#f5f5f5;border-radius:8px"><div style="font-size:12px;color:#666">Баланс</div><div style="font-size:28px;font-weight:700;margin:8px 0">${formatAGS(await getBalance())} AGS</div><button class="btn btn-sm" onclick="showScreen('transfer')">Отправить</button></div><h3 style="margin-top:24px">Быстрый доступ</h3><button class="btn btn-full" onclick="showScreen('nft-store');refreshNftStore()" style="margin-bottom:8px">🛍️ Store NFT</button><button class="btn btn-full" onclick="showScreen('my-nfts');refreshMyNfts()" style="margin-bottom:8px">🖼️ Мои NFT</button><button class="btn btn-full" onclick="showScreen('marketplace');refreshMarketplace()" style="margin-bottom:8px">📊 Маркетплейс</button><button class="btn btn-full" onclick="showScreen('auctions');refreshAuctions()">🎯 Аукционы</button>`}}
async function getBalance(){const user=await getCurrentUser();if(!user)return 0;const{data:w}=await sb.from('wallets').select('balance').eq('user_id',user.id).single();return w?.balance||0}
async function refreshBalance(){const cont=document.getElementById('balance-content');if(!cont)return;const user=await getCurrentUser();if(!user){showScreen('login');return}const balance=await getBalance();const{data:txs}=await sb.from('transactions').select('*').or(`sender_username_id.eq.${user.id},receiver_username_id.eq.${user.id}`).order('created_at',{ascending:false}).limit(10);cont.innerHTML=`<div style="padding:16px;background:#f5f5f5;border-radius:8px;margin-bottom:16px"><div style="font-size:12px;color:#666">Текущий баланс</div><div style="font-size:32px;font-weight:700">${formatAGS(balance)} AGS</div></div><h3>Последние транзакции</h3>${(txs||[]).map(t=>`<div class="transaction-item"><div>${t.comment||'Перевод'}</div><div class="transaction-amount">${t.amount>0?'+':'-'}${formatAGS(Math.abs(t.amount))} AGS</div><div class="transaction-date">${new Date(t.created_at).toLocaleString('ru')}</div></div>`).join('')||'<div class="empty-state">Нет транзакций</div>'}`}
async function handleTransferPreview(e){e.preventDefault();const to=document.getElementById('tr-to').value.trim();const amount=parseInt(document.getElementById('tr-amount').value);hideError('tr-error');const comment=document.getElementById('tr-comment').value.trim();if(!to||!amount||amount<=0)return showError('tr-error','Проверьте данные');try{const balance=await getBalance();if(balance<amount)return showError('tr-error','Недостаточно AGS');const{data:recUser}=await sb.from('usernames').select('user_id').eq('username',to.replace('@','').toLowerCase()).single();if(!recUser)return showError('tr-error','Пользователь не найден');const user=await getCurrentUser();const{error:txErr}=await sb.from('transactions').insert({id:generateTxId(),sender_username_id:user.id,receiver_username_id:recUser.user_id,amount,comment});if(txErr)return showError('tr-error',txErr.message);const{data:w}=await sb.from('wallets').select('*').eq('user_id',user.id).single();await sb.from('wallets').update({balance:w.balance-amount}).eq('user_id',user.id);toast('Перевод отправлен!');document.getElementById('form-transfer').reset();await refreshMain()}catch(e){showError('tr-error',e.message)}}
async function handleTap(){const user=await getCurrentUser();if(!user)return showScreen('login');const today=new Date().toISOString().split('T')[0];const{data:tap}=await sb.from('taps').select('*').eq('user_id',user.id).eq('date',today).single();const newCount=(tap?.taps_count||0)+1;if(tap){await sb.from('taps').update({taps_count:newCount}).eq('id',tap.id)}else{await sb.from('taps').insert({user_id:user.id,date:today,taps_count:newCount})}document.getElementById('tap-count').textContent=newCount;const agg=await sb.from('taps').select('taps_count',{count:'exact'}).eq('user_id',user.id).order('date',{ascending:false});const total=(agg.data||[]).reduce((sum,t)=>sum+t.taps_count,0);document.getElementById('tap-streak').textContent=`Всего: ${total} тапов`}
async function refreshProfile(){const user=await getCurrentUser();if(!user)return;const primary=await getPrimaryUsername(user.id);const alts=(await getUserUsernames(user.id)).filter(u=>!u.is_primary);document.getElementById('profile-header-container').innerHTML=`<div class="profile-header"><div class="profile-username">@${primary?.username||'?'}</div><div class="profile-meta"><span class="lvl-badge">lvl ${user.level||1}</span>${user.is_founder?'<span class="founder-badge">◆ FOUNDER</span>':''}</div><div class="profile-date">В Aegis с ${new Date(user.created_at).toLocaleDateString('ru')}</div></div>`;const uns=await getUserUsernames(user.id);document.getElementById('profile-usernames').innerHTML=uns.map(u=>{const canDelete=!u.is_primary&&uns.length>1;return `<div style="padding:11px 0;border-bottom:1px solid #eee"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600">@${u.username}</span><div><span class="username-badge">${u.category}</span></div></div></div>`}).join('')}
async function handleBuyUsername(e){e.preventDefault();const un=document.getElementById('buy-username').value.trim();hideError('buy-error');if(!un)return showError('buy-error','Введите username');try{const user=await getCurrentUser();if(!user)return;const balance=await getBalance();const price=user.is_founder?0:6000;if(balance<price)return showError('buy-error','Недостаточно AGS');const clean=un.replace('@','').toLowerCase();await sb.from('usernames').insert({user_id:user.id,username:clean,is_primary:false,category:'common'});if(!user.is_founder){const{data:w}=await sb.from('wallets').select('*').eq('user_id',user.id).single();await sb.from('wallets').update({balance:w.balance-price}).eq('user_id',user.id)}toast('Username создан!');document.getElementById('form-buy-username').reset();await refreshProfile();showScreen('profile')}catch(e){showError('buy-error',e.message)}}
document.addEventListener('DOMContentLoaded',async()=>{const regRecoveryInput=document.getElementById('reg-recovery');if(regRecoveryInput){regRecoveryInput.onclick=()=>{const code=generateRecoveryCode();regRecoveryInput.value=code}}});
(async()=>{const user=await getCurrentUser();if(user){nftLoginUsername=localStorage.getItem('nft_username')||'';nftLoginPassword=localStorage.getItem('nft_password')||'';if(!nftLoginUsername||!nftLoginPassword){const clean=user.username;const{data:un}=await sb.from('usernames').select('username').eq('user_id',user.id).eq('is_primary',true).single();if(un){nftLoginUsername=un.username}}await ensureNftSession();showScreen('main')}})();
</script>
</body>
