<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AEGIS Test</title>
<style>
body{font-family:sans-serif;background:#fff;color:#000;display:flex;justify-content:center;padding:20px}
.app{width:100%;max-width:400px}
.screen{display:none}
.screen.active{display:block}
.btn{width:100%;padding:15px;background:#000;color:#fff;border:none;border-radius:8px;font-size:16px;margin-top:10px}
input{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px;font-size:16px}
.error{color:red;margin-top:10px}
</style>
</head>
<body>
<div class="app">
    <div id="login-screen" class="screen active">
        <h2>Вход (Тест)</h2>
        <input type="text" id="l-user" placeholder="Username">
        <input type="password" id="l-pass" placeholder="Пароль">
        <div id="l-err" class="error"></div>
        <button class="btn" onclick="doLogin()">Войти</button>
        <button class="btn" style="background:#fff;color:#000;border:1px solid #000" onclick="show('reg')">Регистрация</button>
    </div>

    <div id="reg-screen" class="screen">
        <h2>Регистрация (Тест)</h2>
        <input type="text" id="r-user" placeholder="Username">
        <input type="password" id="r-pass" placeholder="Пароль">
        <div id="r-err" class="error"></div>
        <button class="btn" onclick="doReg()">Создать</button>
        <button class="btn" style="background:#fff;color:#000;border:1px solid #000" onclick="show('login')">Назад</button>
    </div>

    <div id="main-screen" class="screen">
        <h2>Привет, <span id="u-name"></span>!</h2>
        <p>Баланс: <b id="u-bal">2000</b> AGS</p>
        <button class="btn" onclick="tap()">TAP (+0.2)</button>
        <button class="btn" style="background:#fff;color:#000;border:1px solid #000" onclick="logout()">Выйти</button>
    </div>
</div>

<script>
// Простая эмуляция для проверки работы интерфейса на iPhone
let users = JSON.parse(localStorage.getItem('aegis_users')) || {};
let currentUser = null;

function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id + '-screen').classList.add('active');
}

function doReg() {
    const u = document.getElementById('r-user').value;
    const p = document.getElementById('r-pass').value;
    if(u.length < 5) { document.getElementById('r-err').innerText = 'Минимум 5 символов'; return; }
    if(users[u]) { document.getElementById('r-err').innerText = 'Занят'; return; }
    
    users[u] = { pass: p, balance: 2000 };
    localStorage.setItem('aegis_users', JSON.stringify(users));
    alert('Создан! Теперь войди.');
    show('login');
}

function doLogin() {
    const u = document.getElementById('l-user').value;
    const p = document.getElementById('l-pass').value;
    if(users[u] && users[u].pass === p) {
        currentUser = u;
        document.getElementById('u-name').innerText = u;
        document.getElementById('u-bal').innerText = users[u].balance;
        show('main');
    } else {
        document.getElementById('l-err').innerText = 'Неверный логин/пароль';
    }
}

function tap() {
    if(!currentUser) return;
    users[currentUser].balance += 0.2;
    localStorage.setItem('aegis_users', JSON.stringify(users));
    document.getElementById('u-bal').innerText = users[currentUser].balance.toFixed(1);
}

function logout() {
    currentUser = null;
    show('login');
}
</script>
</body>
</html>
