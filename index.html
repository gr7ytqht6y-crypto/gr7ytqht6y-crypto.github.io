<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#000;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:420px;min-height:100vh;position:relative;padding-bottom:80px}
.screen{display:none;padding:20px 16px}
.screen.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;font-size:26px;font-weight:800;letter-spacing:1.5px;margin-bottom:26px;padding-top:8px}
.logo-circle{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:2px solid #000;border-radius:50%;margin-right:5px;font-size:17px}
.logo-small{font-size:18px;margin-bottom:14px}
.logo-small .logo-circle{width:28px;height:28px;font-size:14px}
.back-btn{background:none;border:none;font-size:15px;cursor:pointer;margin-bottom:12px;color:#000;font-weight:500}
.back-btn::before{content:'← '}
.form{display:flex;flex-direction:column;gap:12px}
.input-group{display:flex;flex-direction:column;gap:5px}
.input-group label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.input-group input,.input-group select{padding:12px 13px;border:1.5px solid #000;font-size:16px;border-radius:6px;font-family:inherit}
.input-group input:focus,.input-group select:focus{outline:none;border-width:2.5px}
.hint{font-size:12px;color:#666}
.error{color:#000;font-size:13px;font-weight:600;padding:10px;border:1.5px solid #000;background:#f5f5f5;display:none;border-radius:6px}
.error.show{display:block}
.btn{padding:13px 15px;background:#000;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;border-radius:6px;font-family:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;user-select:none}
.btn:active{opacity:.75}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-outline{background:#fff;color:#000;border:1.5px solid #000}

.btn-full{width:100%}
.link{text-align:center;margin-top:16px;font-size:14px}

.balance-section{text-align:center;padding:20px 0 16px;border-bottom:1.5px solid #000;margin-bottom:14px}

.balance-currency{font-size:18px;color:#666;margin-left:4px;font-weight:600}

.balance-convert-btn{margin-top:10px;padding:7px 14px;background:#fff;border:1.5px solid #000;font-size:13px;font-weight:600;cursor:pointer;border-radius:6px;font-family:inherit}
.balance-convert-btn:hover{background:#000;color:#fff}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.action-btn{padding:14px 8px;background:#fff;border:1.5px solid #000;font-size:14px;font-weight:600;cursor:pointer;border-radius:6px;font-family:inherit}
.action-btn:hover{background:#000;color:#fff}
.search-box{margin-bottom:14px}
.search-box input{width:100%;padding:11px 13px;border:1.5px solid #000;font-size:15px;border-radius:6px;font-family:inherit}
.search-results{margin-top:8px}
.search-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee}
.search-item-name{font-weight:600;font-size:14px}
.search-item-cat{font-size:11px;color:#666;text-transform:uppercase}
.search-item-btn{padding:5px 10px;background:#000;color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;border-radius:5px}
.section-title{font-size:12px;font-weight:700;margin-bottom:9px;text-transform:uppercase;letter-spacing:1px;color:#333}
.tx-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #eee;cursor:pointer}
.tx-info{flex:1;min-width:0}
.tx-title{font-weight:600;font-size:14px;margin-bottom:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tx-sub{font-size:11px;color:#666}
.tx-amount{font-weight:700;font-size:14px;white-space:nowrap;margin-left:8px}
.tx-amount.positive::before{content:'+'}
.tx-amount.negative::before{content:'−'}
.empty-state{text-align:center;padding:26px 14px;color:#666;font-size:14px;line-height:1.45}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;border-top:1.5px solid #000;display:flex;justify-content:space-around;padding:8px 0 11px;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px;color:#666;padding:3px 9px}
.nav-item.active{color:#000;font-weight:700}
.nav-icon{font-size:17px}
.filters{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto}
.filter-chip{padding:5px 11px;border:1.5px solid #000;background:#fff;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;border-radius:14px;font-family:inherit}
.filter-chip.active{background:#000;color:#fff}
.pin-display{display:flex;gap:9px;justify-content:center;margin:20px 0}
.pin-dot{width:13px;height:13px;border:2px solid #000;border-radius:50%}
.pin-dot.filled{background:#000}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:250px;margin:0 auto}
.pin-key{padding:16px;background:#fff;border:1.5px solid #000;font-size:20px;font-weight:600;cursor:pointer;border-radius:7px;font-family:inherit}
.pin-key:hover{background:#000;color:#fff}
.tap-container{text-align:center;padding:14px 0}
.tap-counter{font-size:13px;color:#666;margin-bottom:14px}
.tap-counter strong{color:#000;font-size:15px}
.tap-btn{width:170px;height:170px;border-radius:50%;background:#000;color:#fff;border:none;font-size:24px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 5px 16px rgba(0,0,0,.14);-webkit-appearance:none;appearance:none;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
.tap-btn.tap-press{transform:scale(.92);transition:transform .08s ease}.tap-btn{transition:transform .12s ease}
.tap-btn:disabled{opacity:.4;cursor:not-allowed}

.frame-blue{border-color:#007bff!important}
.frame-red{border-color:#ff3b30!important}
.frame-yellow{border-color:#ffcc00!important}

.bg-blue{background-color:#007bff!important}
.bg-red{background-color:#ff3b30!important}

.pattern-lightning{background-image:url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M13 2L3 14h9l-1 8 10-12h-9l1-8z' fill='rgba(255,255,255,0.2)'/%3E%3C/svg%3E")!important;background-size:24px 24px!important}
.pattern-diamonds{background-image:url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 0l10 10-10 10L0 10z' fill='rgba(255,255,255,0.2)'/%3E%3C/svg%3E")!important;background-size:20px 20px!important}
.pattern-dollar-circle{background-image:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='16' fill='none' stroke='rgba(255,255,255,0.25)' stroke-width='2'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='rgba(255,255,255,0.3)' font-size='18' font-weight='bold'%3E$%3C/text%3E%3C/svg%3E")!important;background-size:40px 40px!important}
.pattern-grid{background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px)!important;background-size:16px 16px!important}
.pattern-dots{background-image:radial-gradient(rgba(255,255,255,.2) 1.5px,transparent 1.5px)!important;background-size:14px 14px!important}
.avatar-wrapper{position:relative;width:90px;height:90px;margin:0 auto 10px;border-radius:50%;border:3px solid #fff;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#f5f5f5}
.profile-header.dark-mode .avatar-wrapper,.profile-header.founder .avatar-wrapper{border-color:#fff}
.avatar-wrapper img{width:100%;height:100%;object-fit:cover}
.avatar-placeholder{font-size:36px;color:#666}
.avatar-edit-overlay{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.8);color:#fff;font-size:10px;font-weight:600;text-align:center;padding:4px 0;opacity:0;transition:opacity .2s}
.avatar-wrapper:hover .avatar-edit-overlay{opacity:1}
.avatar-frame-blue{border-color:#007bff!important}
.avatar-frame-red{border-color:#ff3b30!important}
.avatar-frame-green{border-color:#34c759!important}
.avatar-frame-purple{border-color:#af52de!important}
.avatar-frame-orange{border-color:#ff9500!important}
.avatar-frame-white{border-color:#fff!important}
.avatar-frame-black{border-color:#000!important}
.avatar-frame-double{border-style:double!important;border-width:6px!important;border-color:#000!important}
.avatar-frame-dashed{border-style:dashed!important;border-width:3px!important;border-color:#000!important}
.avatar-frame-thick{border-style:solid!important;border-width:6px!important;border-color:#000!important}
.avatar-frame-neon{border-color:#00f3ff!important}
.sticker{position:absolute;font-size:24px;cursor:grab;user-select:none;z-index:5;line-height:1;touch-action:none}
.profile-username{font-size:22px;font-weight:800;margin:0 0 6px 0;display:block;text-align:center}
.profile-meta{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.lvl-badge{font-size:12px;font-weight:700;padding:2px 7px;background:#000;color:#fff;border-radius:4px}
.profile-header.founder .lvl-badge{background:#fff;color:#000}
.profile-status{font-size:13px;color:#666;margin-bottom:8px;font-style:italic}
.profile-alt-usernames{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-bottom:8px}
.alt-un-badge{font-size:12px;padding:3px 9px;background:rgba(0,0,0,.08);border-radius:10px;font-weight:600;color:#333}
.profile-header.dark-mode .alt-un-badge,.profile-header.founder .alt-un-badge{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.profile-date{font-size:12px;color:#666}
.profile-founder-tag{font-size:11px;font-weight:700;letter-spacing:1px;margin-top:6px;padding:3px 9px;border:1px solid #fff;display:inline-block;color:#fff;border-radius:3px}
.profile-account-num{font-size:10px;color:#666;margin-top:5px;font-family:monospace}
.menu-section{margin-bottom:18px}
.menu-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:7px}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;cursor:pointer;font-size:14px;font-weight:500}
.menu-item::after{content:'→';opacity:.35}
.un-actions{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap}
.un-action-btn{flex:1;min-width:70px;padding:6px;background:#fff;border:1.5px solid #000;font-size:12px;font-weight:600;cursor:pointer;border-radius:4px;font-family:inherit}
.un-action-btn:hover{background:#000;color:#fff}
.founder-badge{display:inline-block;background:transparent;color:#fff;border:1px solid #fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px}
.username-badge{display:inline-block;padding:2px 6px;background:#000;color:#fff;font-size:10px;font-weight:700;border-radius:3px;margin-left:4px}
.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.summary-row.total{border-top:1.5px solid #000;border-bottom:none;font-weight:700;font-size:15px;padding-top:10px;margin-top:3px}
.summary-row .label{color:#666}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border:1.5px solid #000;padding:20px;max-width:340px;width:100%;border-radius:9px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:10px}
.modal-body{font-size:14px;margin-bottom:14px;line-height:1.45}
.modal-actions{display:flex;gap:8px}
.modal-actions .btn{flex:1}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .2s;max-width:90%;border-radius:6px}
.toast.show{opacity:1}
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.shop-item{border:1.5px solid #000;padding:10px 6px;text-align:center;cursor:pointer;border-radius:7px}
.shop-item:hover{background:#f5f5f5}
.shop-item.selected{border-width:2.5px;background:#000;color:#fff}
.shop-item-preview{width:38px;height:38px;margin:0 auto 6px;border-radius:50%;border:2px solid #000}
.shop-item-name{font-size:11px;font-weight:600;margin-bottom:2px}
.shop-item-price{font-size:10px;color:#666;font-weight:600}
.shop-item.selected .shop-item-price{color:#ccc}
.task-item{border:1.5px solid #000;padding:12px;margin-bottom:8px;border-radius:7px;display:flex;justify-content:space-between;align-items:center}
.task-info{flex:1}
.task-title{font-weight:600;font-size:14px}
.task-reward{font-size:12px;color:#666;margin-top:2px}
.sticker-controls{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.sticker-controls input{width:58px;padding:5px;border:1px solid #000;border-radius:4px;font-size:12px}
.sticker-controls button{padding:5px 8px;background:#000;color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer}
.lb-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #eee;gap:12px}
.lb-rank{font-weight:800;font-size:16px;width:28px;text-align:center}
.lb-info{flex:1}
.lb-name{font-weight:600;font-size:15px}

.nft-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}

.nft-card-bg{padding:12px 10px 14px;min-height:190px;display:flex;flex-direction:column;align-items:center}

const RARITY_CLASS = {
  'Common':'rarity-common',
  'Rare':'rarity-rare',
  'Epic':'rarity-epic',
  'Mythic':'rarity-mythic',
  'Legendary':'rarity-legendary'
};

function getNft(id){return NFT_CATALOG.find(n=>n.id===id)}

/* ===== NFT STORE ===== */
async function refreshNftStore(){
  const grid=document.getElementById('nft-store-grid');
  if(!grid)return;
  grid.innerHTML=NFT_CATALOG.map(n=>`
    <div class="nft-card">
      <div class="nft-card-bg ${RARITY_CLASS[n.rarity]}">
        <div class="nft-rarity">${n.rarity}</div>
        <img class="nft-img" src="assets/nfts/${n.image}" alt="${n.name}" onerror="this.style.opacity=0.3">
        <div class="nft-name">${n.name}</div>
        <div class="nft-price">${formatAGS(n.price)} AGS</div>
        <div class="nft-actions">
          <button class="btn btn-full" id="buy-${n.id}" onclick="buyNft('${n.id}',this)">Купить</button>
          <button class="btn btn-outline btn-full" onclick="buyAndGift('${n.id}')">Купить и подарить</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function buyNft(catalogId, btn){
  if(btn)btn.disabled=true;
  try{
    const user=await getCurrentUser();
    if(!user)return;
    const nft=getNft(catalogId);
    if(!nft)return;
    const wallet=await getUserWallet(user.id);
    if(!wallet||Number(wallet.balance)<nft.price){
      toast('Недостаточно AGS');
      return;
    }
    const {error:e1}=await sb.from('wallets').update({balance:Number(wallet.balance)-nft.price})
      .eq('id',wallet.id).eq('balance',Number(wallet.balance));
    if(e1){toast('Ошибка списания');return;}
    const {error:e2}=await sb.from('user_nfts').insert({
      catalog_id:catalogId,
      owner_id:user.id,
      status:'owned',
      purchase_price:nft.price,
      acquired_type:'purchase',
      acquired_at:new Date().toISOString()
    });
    if(e2){
      await sb.from('wallets').update({balance:Number(wallet.balance)}).eq('id',wallet.id);
      toast('Ошибка: '+e2.message);
      return;
    }
    toast('NFT куплена!');
    refreshMain();
  }finally{if(btn)btn.disabled=false;}
}

async function buyAndGift(catalogId){
  const nft=getNft(catalogId);
  if(!nft)return;
  showModal('Купить и подарить',`
    <div class="input-group"><label>Username получателя</label>
    <input type="text" id="gift-username" placeholder="@username"></div>
  `,[
    {text:'Отмена',outline:true,onClick:()=>{}},
    {text:'Купить и подарить',onClick:async()=>{
      const to=await findUserByUsername(document.getElementById('gift-username').value.trim());
      if(!to){toast('Пользователь не найден');return;}
      const user=await getCurrentUser();
      if(to.id===user.id){toast('Нельзя подарить себе');return;}
      const wallet=await getUserWallet(user.id);
      if(!wallet||Number(wallet.balance)<nft.price){toast('Недостаточно AGS');return;}
      const {error:e1}=await sb.from('wallets').update({balance:Number(wallet.balance)-nft.price})
        .eq('id',wallet.id).eq('balance',Number(wallet.balance));
      if(e1){toast('Ошибка списания');return;}
      const {error:e2}=await sb.from('user_nfts').insert({
        catalog_id:catalogId,
        owner_id:to.id,
        status:'owned',
        purchase_price:nft.price,
        acquired_type:'gift',
        gifted_from:user.id,
        acquired_at:new Date().toISOString()
      });
      if(e2){
        await sb.from('wallets').update({balance:Number(wallet.balance)}).eq('id',wallet.id);
        toast('Ошибка: '+e2.message);return;
      }
      toast('NFT подарена!');
    }}
  ]);
}

/* ===== МОИ NFT ===== */
async function refreshMyNfts(){
  const user=await getCurrentUser();
  if(!user)return;
  const {data}=await sb.from('user_nfts').select('*')
    .eq('owner_id',user.id).eq('status','owned')
    .order('acquired_at',{ascending:false});
  const cont=document.getElementById('my-nfts-list');
  if(!data||!data.length){
    cont.innerHTML='<div class="empty-state">У вас пока нет NFT</div>';
    return;
  }
  cont.innerHTML=data.map(item=>{
    const n=getNft(item.catalog_id);
    if(!n)return'';
    return `<div class="nft-card" style="margin-bottom:12px" onclick="openMyNft('${item.id}')">
      <div class="nft-card-bg ${RARITY_CLASS[n.rarity]}">
        <div class="nft-rarity">${n.rarity}</div>
        <img class="nft-img" src="assets/nfts/${n.image}" onerror="this.style.opacity=0.3">
        <div class="nft-name">${n.name}</div>
        <div class="nft-price">${formatAGS(n.price)} AGS</div>
        ${item.acquired_type==='gift'?'<div style="font-size:11px;color:#666">Получено в подарок</div>':''}
      </div>
    </div>`;
  }).join('');
}

async function openMyNft(userNftId){
  const {data:item}=await sb.from('user_nfts').select('*').eq('id',userNftId).single();
  if(!item)return;
  const n=getNft(item.catalog_id);
  if(!n)return;
  const date=new Date(item.acquired_at).toLocaleDateString('ru');
  document.getElementById('nft-detail-content').innerHTML=`
    <div class="nft-card-bg ${RARITY_CLASS[n.rarity]}" style="border-radius:10px;padding:20px;margin-bottom:16px">
      <div class="nft-rarity">${n.rarity}</div>
      <img class="nft-detail-img" src="assets/nfts/${n.image}" onerror="this.style.opacity=0.3">
      <div style="text-align:center;font-size:20px;font-weight:800;margin-bottom:6px">${n.name}</div>
      <div style="text-align:center;font-size:16px;font-weight:700;margin-bottom:12px">${formatAGS(n.price)} AGS</div>
    </div>
    <div class="summary-row"><span class="label">Цена покупки</span><span>${formatAGS(item.purchase_price||n.price)} AGS</span></div>
    <div class="summary-row"><span class="label">Дата</span><span>${date}</span></div>
    <div class="summary-row"><span class="label">Тип</span><span>${item.acquired_type==='gift'?'Подарок':'Покупка'}</span></div>
    <div style="height:16px"></div>
    <button class="btn btn-full" style="margin-bottom:8px" onclick="sellMyNft('${item.id}')">Продать</button>
    <button class="btn btn-outline btn-full" style="margin-bottom:8px" onclick="giftMyNft('${item.id}')">Подарить</button>
    <button class="btn btn-outline btn-full" disabled>Прокачать (скоро)</button>
  `;
  showScreen('nft-detail');
}

/* Добавляем кнопку NFT на главную и в профиль */
async function showScreen(name){
  // существующая логика showScreen остаётся
  // + добавляем:
  if(name==='nft-store') await refreshNftStore();
  if(name==='my-nfts') await refreshMyNfts();
  // ...
}
