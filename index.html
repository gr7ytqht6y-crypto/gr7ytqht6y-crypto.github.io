<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AEGIS Bank</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#000;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:420px;min-height:100vh;position:relative;padding-bottom:80px}
.screen{display:none;padding:20px 16px}
.screen.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;font-size:26px;font-weight:800;letter-spacing:1.5px;margin-bottom:26px;padding-top:8px}
.logo-circle{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:2px solid #000;border-radius:50%;margin-right:5px;font-size:17px}
.btn{padding:13px 15px;background:#000;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;border-radius:6px;font-family:inherit;width:100%}
.btn:hover{opacity:.88}
.btn-outline{background:#fff;color:#000;border:1.5px solid #000}
.form{display:flex;flex-direction:column;gap:12px}
.input-group{display:flex;flex-direction:column;gap:5px}
.input-group label{font-size:12px;font-weight:700;text-transform:uppercase}
.input-group input,.input-group select{padding:12px;border:1.5px solid #000;font-size:16px;border-radius:6px;width:100%}
.error{color:#000;font-size:13px;padding:10px;border:1.5px solid #000;background:#f5f5f5;display:none;margin-top:10px}
.error.show{display:block}
.balance-section{text-align:center;padding:30px 0;border-bottom:1.5px solid #000;margin-bottom:20px}
.balance-amount{font-size:48px;font-weight:800}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.action-btn{padding:15px;background:#fff;border:1.5px solid #000;font-size:14px;font-weight:600;cursor:pointer;border-radius:6px}
.tap-btn{width:180px;height:180px;border-radius:50%;background:#000;color:#fff;border:none;font-size:24px;font-weight:800;cursor:pointer;margin:20px auto;display:block}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 20px;border-radius:6px;opacity:0;transition:opacity 0.3s;z-index:999}
.toast.show{opacity:1}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1.5px solid #000;display:flex;justify-content:space-around;padding:10px;z-index:100}
.nav-item{font-size:12px;text-align:center;cursor:pointer;color:#666}
.nav-item.active{color:#000;font-weight:700}
.profile-header{text-align:center;padding:20px;border:2px solid #000;border-radius:12px;margin-bottom:20px}
.qr-box{margin:20px auto;display:flex;justify-content:center}
.menu-item{padding:15px 0;border-bottom:1px solid #eee;font-size:15px;cursor:pointer;display:flex;justify-content:space-between}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;margin:20px 0 10px;color:#666}
.tx-item{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.show{display:flex}
.modal-content{background:#fff;padding:20px;border-radius:12px;width:100%;max-width:350px}
</style>
</head>
<body>

<div class="app">
    <!-- LOGIN -->
    <div id="screen-login" class="screen active">
        <div class="logo"><span class="logo-circle">$</span>AEGI$</div>
        <form class="form" onsubmit="handleLogin(event)">
            <div class="input-group"><label>Username</label><input type="text" id="login-user" placeholder="@username" required></div>
            <div class="input-group"><label>Пароль</label><input type="password" id="login-pass" required></div>
            <div id="login-err" class="error"></div>
            <button type="submit" class="btn">Войти</button>
        </form>
        <div style="text-align:center;margin-top:20px"><a href="#" onclick="nav('register')">Создать аккаунт</a></div>
    </div>

    <!-- REGISTER -->
    <div id="screen-register" class="screen">
        <div class="logo"><span class="logo-circle">$</span>AEGI$</div>
        <form class="form" onsubmit="handleReg(event)">
            <div class="input-group"><label>Username</label><input type="text" id="reg-user" required></div>
            <div class="input-group"><label>Пароль</label><input type="password" id="reg-pass" required></div>
            <div class="input-group"><label>Повтор</label><input type="password" id="reg-pass2" required></div>
            <div id="reg-err" class="error"></div>
            <button type="submit" class="btn">Создать</button>
        </form>
        <div style="text-align:center;margin-top:20px"><a href="#" onclick="nav('login')">Назад</a></div>
    </div>

    <!-- MAIN -->
    <div id="screen-main" class="screen">
        <div class="logo"><span class="logo-circle">$</span>AEGI$</div>
        <div class="balance-section">
            <div style="font-size:12px;color:#666">БАЛАНС</div>
            <div class="balance-amount"><span id="main-bal">0</span> AGS</div>
            <div style="font-size:14px;color:#666">≈ $<span id="main-usd">0.00</span></div>
        </div>
        <div class="actions-grid">
            <button class="action-btn" onclick="nav('transfer')">Перевести</button>
            <button class="action-btn" onclick="nav('history')">История</button>
        </div>
        <div class="section-title">Tap to Earn</div>
        <button class="tap-btn" onclick="doTap()">TAP</button>
        <div style="text-align:center;font-size:12px;color:#666">+0.2 AGS за тап</div>
    </div>

    <!-- PROFILE -->
    <div id="screen-profile" class="screen">
        <div class="profile-header">
            <div style="font-size:24px;font-weight:800" id="prof-name">@user</div>
            <div style="color:#666;margin-top:5px" id="prof-lvl">lvl 1</div>
            <div class="qr-box" id="prof-qr"></div>
        </div>
        <div class="menu-item" onclick="nav('leaderboard')">Лидерборд →</div>
        <div class="menu-item" onclick="logout()">Выйти →</div>
    </div>

    <!-- HISTORY -->
    <div id="screen-history" class="screen">
        <h2 style="margin-bottom:20px">История</h2>
        <div id="hist-list"><div style="color:#666;text-align:center;padding:20px">Загрузка...</div></div>
        <button class="btn btn-outline" style="margin-top:20px" onclick="nav('main')">Назад</button>
    </div>

    <!-- TRANSFER -->
    <div id="screen-transfer" class="screen">
        <h2 style="margin-bottom:20px">Перевод</h2>
        <form class="form" onsubmit="doTransfer(event)">
            <div class="input-group"><label>Кому</label><input type="text" id="tr-to" placeholder="@username" required></div>
            <div class="input-group"><label>Сумма</label><input type="number" id="tr-amt" min="1" required></div>
            <div id="tr-err" class="error"></div>
            <button type="submit" class="btn">Отправить</button>
        </form>
        <button class="btn btn-outline" style="margin-top:10px" onclick="nav('main')">Назад</button>
    </div>

    <!-- LEADERBOARD -->
    <div id="screen-leaderboard" class="screen">
        <h2 style="margin-bottom:20px">Топ пользователей</h2>
        <div id="lb-list"></div>
        <button class="btn btn-outline" style="margin-top:20px" onclick="nav('profile')">Назад</button>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="nav('main')">🏠 Главная</div>
        <div class="nav-item" onclick="nav('profile')">👤 Профиль</div>
    </div>

    <div id="toast" class="toast"></div>
</div>

<script>
// === CONFIG ===
const SB_URL = 'https://etxrbcfxkcumvedivusr.supabase.co';
const SB_KEY = 'ВСТАВЬ_СЮДА_СВОЙ_sb_publishable_КЛЮЧ'; 
const sb = window.supabase.createClient(SB_URL, SB_KEY);

let me = null;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function nav(s){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('screen-'+s).classList.add('active');if(s==='main')loadMain();if(s==='profile')loadProfile();if(s==='history')loadHistory();if(s==='leaderboard')loadLB()}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return 'h_'+Math.abs(h).toString(36)}

async function handleLogin(e){
    e.preventDefault();
    const u=document.getElementById('login-user').value.trim().replace('@','');
    const p=document.getElementById('login-pass').value;
    const {data,err}=await sb.from('users').select('*').eq('username',u).single();
    if(err||!data||data.password_hash!==hash(p)){document.getElementById('login-err').innerText='Неверные данные';document.getElementById('login-err').classList.add('show');return}
    me=data;toast('Добро пожаловать!');nav('main');
}

async function handleReg(e){
    e.preventDefault();
    const u=document.getElementById('reg-user').value.trim().toLowerCase();
    const p=document.getElementById('reg-pass').value;
    if(u.length<5){document.getElementById('reg-err').innerText='Минимум 5 символов';document.getElementById('reg-err').classList.add('show');return}
    if(p!==document.getElementById('reg-pass2').value){document.getElementById('reg-err').innerText='Пароли не совпадают';document.getElementById('reg-err').classList.add('show');return}
    const {data:ex}=await sb.from('users').select('id').eq('username',u).single();
    if(ex){document.getElementById('reg-err').innerText='Занят';document.getElementById('reg-err').classList.add('show');return}
    const {data:newU}=await sb.from('users').insert([{username:u,password_hash:hash(p),level:1}]).select().single();
    await sb.from('wallets').insert([{user_id:newU.id,balance:2000}]);
    await sb.from('usernames').insert([{user_id:newU.id,username:u,is_primary:true,category:'common'}]);
    toast('Успешно! Войдите.');nav('login');
}

async function loadMain(){
    if(!me)return;
    const {data:w}=await sb.from('wallets').select('balance').eq('user_id',me.id).single();
    if(w){document.getElementById('main-bal').innerText=Math.floor(w.balance);document.getElementById('main-usd').innerText=(w.balance/100).toFixed(2)}
}

async function doTap(){
    if(!me)return;
    const {data:w}=await sb.from('wallets').select('balance').eq('user_id',me.id).single();
    if(w){
        const nb=w.balance+0.2;
        await sb.from('wallets').update({balance:nb}).eq('user_id',me.id);
        document.getElementById('main-bal').innerText=Math.floor(nb);
        const b=document.querySelector('.tap-btn');b.style.transform='scale(0.95)';setTimeout(()=>b.style.transform='scale(1)',100);
    }
}

async function loadProfile(){
    if(!me)return;
    const {data:un}=await sb.from('usernames').select('username').eq('user_id',me.id).eq('is_primary',true).single();
    if(un){
        document.getElementById('prof-name').innerText='@'+un.username;
        document.getElementById('prof-lvl').innerText='lvl '+me.level;
        document.getElementById('prof-qr').innerHTML='';
        new QRCode(document.getElementById('prof-qr'),{text:'aegis://'+un.username,width:128,height:128});
    }
}

async function loadHistory(){
    if(!me)return;
    const {data:txs}=await sb.from('transactions').select('*,sender:sender_username_id(username),receiver:receiver_username_id(username)').or(`sender_username_id.eq.${me.id},receiver_username_id.eq.${me.id}`).order('created_at',{ascending:false}).limit(20);
    const box=document.getElementById('hist-list');
    if(!txs||!txs.length){box.innerHTML='<div style="color:#666;text-align:center">Нет операций</div>';return}
    box.innerHTML=txs.map(t=>{
        const isOut=t.sender?.username===document.getElementById('prof-name').innerText.replace('@','');
        return `<div class="tx-item"><div>${isOut?'→':'←'} ${isOut?t.receiver?.username:t.sender?.username}</div><div style="font-weight:700">${isOut?'-':'+'}${t.amount}</div></div>`;
    }).join('');
}

async function doTransfer(e){
    e.preventDefault();
    const to=document.getElementById('tr-to').value.trim().replace('@','');
    const amt=parseFloat(document.getElementById('tr-amt').value);
    const {data:rU}=await sb.from('users').select('id').eq('username',to).single();
    if(!rU){document.getElementById('tr-err').innerText='Пользователь не найден';document.getElementById('tr-err').classList.add('show');return}
    const {data:mW}=await sb.from('wallets').select('balance').eq('user_id',me.id).single();
    if(mW.balance<amt){document.getElementById('tr-err').innerText='Недостаточно средств';document.getElementById('tr-err').classList.add('show');return}
    
    // Списываем у себя
    await sb.from('wallets').update({balance:mW.balance-amt}).eq('user_id',me.id);
    // Начисляем получателю
    const {data:rW}=await sb.from('wallets').select('balance').eq('user_id',rU.id).single();
    await sb.from('wallets').update({balance:rW.balance+amt}).eq('user_id',rU.id);
    // Записываем транзакцию
    const {data:mUn}=await sb.from('usernames').select('id').eq('user_id',me.id).eq('is_primary',true).single();
    const {data:rUn}=await sb.from('usernames').select('id').eq('user_id',rU.id).eq('is_primary',true).single();
    await sb.from('transactions').insert([{sender_username_id:mUn.id,receiver_username_id:rUn.id,amount:amt,status:'completed'}]);
    
    toast('Перевод выполнен!');nav('main');
}

async function loadLB(){
    const {data}=await sb.from('users').select('username,level').order('level',{ascending:false}).limit(10);
    document.getElementById('lb-list').innerHTML=data.map((u,i)=>`<div class="tx-item"><div>#${i+1} @${u.username}</div><div>lvl ${u.level}</div></div>`).join('');
}

function logout(){me=null;nav('login')}
nav('login');
</script>
</body>
</html>
