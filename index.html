<!DOCTYPE html>
<html lang="ru"><head>
 <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Aegis">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aegis Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>
:root{--nav:#ececec;--bg:#fff;--fg:#000;--mut:#767676;--line:#e6e6e6;--card:#f6f6f6;--btn:#000;--btnt:#fff}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--nav:#1c1c1e;--bg:#000;--fg:#fff;--mut:#8a8a8a;--line:#222;--card:#111;--btn:#fff;--btnt:#000}}
:root[data-t=dark]{--nav:#1c1c1e;--bg:#000;--fg:#fff;--mut:#8a8a8a;--line:#222;--card:#111;--btn:#fff;--btnt:#000}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 "Helvetica Neue",Arial,sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
main{max-width:620px;margin:0 auto;padding:0 14px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0;font-weight:800;font-size:22px;letter-spacing:-.5px}
button,input,textarea{font:inherit;color:inherit}
.b{background:var(--btn);color:var(--btnt);border:0;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer}
.b.o{background:none;color:var(--fg);border:1px solid var(--line)}.b:disabled{opacity:.5}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:5px 0;outline:0}
textarea{resize:none}
.av{width:42px;height:42px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;object-fit:cover;overflow:hidden}
.av.big{width:92px;height:92px;font-size:34px;margin:0 auto}
.post{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}
.post>div:first-child{flex:none}.post>div:last-child{min-width:0;flex:1}.u{font-weight:700;cursor:pointer}.m{color:var(--mut);font-size:14px}
.txt{white-space:pre-wrap;word-wrap:break-word;margin:3px 0 6px}
.act{display:flex;gap:22px;color:var(--mut)}.act button{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--mut)}.act .on{color:var(--fg);font-weight:700}
.chk{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-left:4px}.chk svg{display:block;width:100%;height:100%}
.chk.s{background:#c0c0c0}.chk.b{background:#1d9bf0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:440px;display:flex;justify-content:space-between;gap:2px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--nav) 99%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.25)}
nav button{flex:1;background:none;border:0;border-radius:999px;color:var(--mut);font-size:11px;padding:7px 2px 6px;cursor:pointer;min-width:0}
nav button b{display:flex;height:26px;align-items:center;justify-content:center;font-size:21px;font-weight:400;line-height:1}
nav .on{color:var(--fg);background:color-mix(in srgb,var(--fg) 12%,transparent)}
.sq{display:grid;grid-template-columns:8px 8px;gap:2px;transform:rotate(45deg)}.sq i{display:block;width:8px;height:8px;border-radius:2px}
main{position:relative}
.ban{position:relative;height:calc(150px + env(safe-area-inset-top,0px));border-radius:0 0 18px 18px;background:#2a2a2a center/cover no-repeat;margin:0 -14px}
.ban::before{content:"";position:absolute;left:0;right:0;top:0;height:100px;border-radius:inherit;background:linear-gradient(rgba(0,0,0,.55),transparent)}
body.prof{padding-top:0}
body.prof header{position:absolute;top:0;left:0;right:0;z-index:2;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
body.prof #bal{color:#fff}
.av.big{border:4px solid var(--bg);margin-top:-48px;position:relative}
.bdg{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--fg);color:var(--bg);vertical-align:2px;letter-spacing:.2px}
.pimg{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:16px;margin:4px 0 8px;background:var(--card)}
.pcol{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:8px;margin:4px 0 8px}.pcol i{display:block;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sm{padding:7px 12px;font-size:14px}
.sel{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font:inherit;font-size:14px;max-width:130px}
.pt{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0 0}.pt .chk{margin:0;vertical-align:baseline}.pt .bdg{vertical-align:baseline}
.cmini{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:6px 0 10px}.cmini i{display:block;height:44px;border-radius:10px;border:1px solid var(--line)}.cmini span{display:block;font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;margin-top:2px}
.urow{flex-wrap:wrap}
.urow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.cgrid i{display:block;height:64px;border-radius:12px;border:1px solid var(--line)}
#tabs{display:flex;gap:6px;margin:14px 0}#tabs .b{flex:1;min-width:0;padding:9px 2px;font-size:14px;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}.ov.c{align-items:center;padding:16px}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}.ov.c .sheet{border-radius:22px}
.bub{width:fit-content;max-width:78%;padding:8px 12px;border-radius:18px;margin:4px 0;word-wrap:break-word;white-space:pre-wrap}.bub.me{margin-left:auto;background:var(--btn);color:var(--btnt)}.bub.th{background:var(--card)}.bt{font-size:11px;opacity:.6;margin-top:2px}
.lock{background:var(--card);border-radius:14px;padding:14px;margin:6px 0 8px;text-align:center}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-bottom:14px}.cc{background:var(--card);border-radius:14px;padding:8px;text-align:center}.cc i{display:block;height:48px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px}.cc b{display:block;font-size:13px}.cc .b{width:100%;margin-top:6px}
.crow{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.seg{display:flex;gap:8px;margin:4px 0 8px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0}
.c{text-align:center}.err{color:#d00;font-size:14px;min-height:18px}
body.auth{--nav:#1c1c1e;--bg:#000;--fg:#fff;--mut:#8a8a8a;--line:#333;--card:#111;--btn:#fff;--btnt:#000}
body.auth a{color:#fff}
.empty{color:var(--mut);text-align:center;padding:40px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:10px 16px;border-radius:999px;display:none;max-width:90%}
.cm{padding:8px 0 0 0;border-top:1px solid var(--line);margin-top:6px}
</style></head><body>
<main id="app"></main><div id="toast"></div>
<script>
// ===== НАСТРОЙКА: вставьте данные своего проекта Supabase (только anon/publishable ключ!) =====
const SUPABASE_URL="https://dyupiflterjbuwqwzjdx.supabase.co", SUPABASE_ANON_KEY="sb_publishable_jLlWRy2qYzPHxJGLL-352g_6H4hpDNp";
// =================================================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const PC="id,username,bio,avatar_url,banner_url,balance,verified,badge,created_at";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr=x=>Array.isArray(x)?x:[];
let lastErr="",pollT=null;
let me=null, tab="feed", viewUser=null, busy=new Set();
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
const MAIL_DOMAIN="mailinator.com"; // служебный домен для Supabase Auth, письма не отправляются
const mail=u=>"ags_"+u.toLowerCase()+"@"+MAIL_DOMAIN;
function lockAt(i){const f=()=>{const v="@"+i.value.replace(/[^a-z0-9_]/gi,"");if(i.value!==v){i.value=v}if(i.selectionStart<1)i.setSelectionRange(1,Math.max(1,i.selectionEnd))};
 i.value="@";["input","click","keyup"].forEach(e=>i.addEventListener(e,f));i.addEventListener("keydown",e=>{if((e.key=="Backspace"&&i.selectionStart<=1&&i.selectionEnd<=1)||(e.key=="Delete"&&i.selectionStart==0)||(e.key=="Home"))e.preventDefault()})}
const okName=u=>/^[a-z0-9_]{3,20}$/i.test(u);
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const mkCode=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(x=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x%32]).join("").replace(/(.{4})/g,"$1-").slice(0,-1);
function ago(d){const s=(Date.now()-new Date(d))/1000;return s<60?"сейчас":s<3600?Math.floor(s/60)+" мин":s<86400?Math.floor(s/3600)+" ч":new Date(d).toLocaleDateString("ru")}
const CK=c=>`<span class="chk" title="${c=="#1d9bf0"?"Синяя галочка":"Серебряная галочка"}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="${c}"/><path d="M6.8 12.6l3.5 3.4 6.9-7.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
const chk=v=>v==="blue"?CK("#1d9bf0"):v==="silver"?CK("#9aa0a6"):"";
const tag=a=>chk(a.verified)+(a.badge?` <span class="bdg">✦︎ ${esc(a.badge)}</span>`:"");
const ava=(p,c="")=>p?.avatar_url?`<img class="av ${c}" src="${esc(p.avatar_url)}" alt="">`:`<div class="av ${c}">${esc((p?.username||"?")[0].toUpperCase())}</div>`;

// ===== Авторизация =====
function authView(mode="in"){
 app.innerHTML=`<header>Aegis Social</header><div class="card">
 <input id="u" value="@" placeholder="@юзернейм" autocapitalize="none" autocorrect="off" maxlength="21" autocomplete="username">
 <input id="p" type="password" placeholder="Пароль" autocomplete="${mode=="in"?"current-password":"new-password"}">
 ${mode=="rec"?'<input id="rc" placeholder="Код восстановления">':""}
 <div class="err" id="e"></div>
 <button class="b" id="go" style="width:100%">${mode=="in"?"Войти":mode=="up"?"Создать аккаунт":"Сменить пароль"}</button>
 <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px"><button class="b" id="s1" style="width:100%">${mode=="in"?"Регистрация":"Вход"}</button>${mode=="in"?'<button class="b" id="s2" style="width:100%">Забыли пароль?</button>':""}</div></div>`;
 document.body.className="auth";lockAt($("#u"));
 $("#s1").onclick=e=>{e.preventDefault();authView(mode=="in"?"up":"in")};
 if($("#s2"))$("#s2").onclick=e=>{e.preventDefault();authView("rec")};
 $("#go").onclick=async()=>{
  const u=$("#u").value.trim().replace(/^@+/,""),p=$("#p").value,e=$("#e");e.textContent="";
  if(!okName(u))return e.textContent="Юзернейм: 3–20 символов, латиница, цифры и _";
  if(p.length<8)return e.textContent="Пароль не короче 8 символов";
  $("#go").disabled=true;
  try{
   if(mode=="in"){const{error}=await sb.auth.signInWithPassword({email:mail(u),password:p});if(error)throw new Error(/invalid login/i.test(error.message)?"Неверный юзернейм или пароль":"Ошибка входа: "+error.message)}
   else if(mode=="up"){
    const code=mkCode();
    const av=await sb.rpc("aegis_username_available",{p_username:u});if(!av.error&&av.data===false)throw new Error("Этот юзернейм занят");
    let{data,error}=await sb.auth.signUp({email:mail(u),password:p,options:{data:{username:u}}});
    if(error)throw new Error(/registered|exists/i.test(error.message)?"Этот юзернейм занят":"Ошибка регистрации: "+error.message);
    if(!data.session){const s2=await sb.auth.signInWithPassword({email:mail(u),password:p});
     if(s2.error)throw new Error(/confirm/i.test(s2.error.message)?"Отключите Confirm email в Supabase: Authentication → Providers → Email":"Этот юзернейм занят");}
    const r=await sb.rpc("aegis_register_profile",{p_username:u,p_recovery_hash:await sha(code)});
    if(r.error){await sb.auth.signOut();throw new Error(/duplicate|unique/i.test(r.error.message)?"Этот юзернейм занят":"Ошибка профиля: "+r.error.message+" (выполнен ли aegis.sql?)")}
    await loadMe();
    alert("Сохраните код восстановления:\n\n"+code+"\n\nОн показывается один раз.");
   }else{
    const rc=$("#rc").value.trim();
    const{error}=await sb.functions.invoke("aegis-recover",{body:{username:u,code:rc,new_password:p}});
    if(error)throw new Error("Не удалось восстановить доступ. Проверьте данные.");
    toast("Пароль изменён. Войдите.");return authView("in")
   }
  }catch(x){let m=x.message||"";
   if(/load failed|failed to fetch|networkerror/i.test(m)){
    let d="";try{const r=await fetch(SUPABASE_URL+"/auth/v1/health",{headers:{apikey:SUPABASE_ANON_KEY}});d=" Сервер отвечает ("+r.status+"), но запрос входа заблокирован: откройте страницу в обычном браузере или на GitHub Pages."}catch(_){d=" Нет связи с "+new URL(SUPABASE_URL).host+": проверьте интернет, блокировщики рекламы/VPN и что проект Supabase не на паузе."}
    m="Нет связи с сервером."+d}
   e.textContent=m;$("#go").disabled=false}
 };
}
async function loadMe(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){me=null;return authView()}
 const{data,error}=await sb.from("profiles").select(PC).eq("id",session.user.id).maybeSingle();
 if(error||!data){me=null;await sb.auth.signOut();authView();const e=$("#e");if(e)e.textContent=error?"Ошибка загрузки профиля: "+error.message:"Профиль не найден. Зарегистрируйтесь заново.";return}
 me=data;go("feed")
}
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"&&!me)loadMe();if(ev==="SIGNED_OUT"){me=null;authView()}});

// ===== Оболочка =====
const SQ='<span class="sq"><i style="background:#ff3b30"></i><i style="background:#34c759"></i><i style="background:#0a84ff"></i><i style="background:#ffcc00"></i></span>';
const TABS=[["feed","≡","Лента"],["trends","↑","Тренды"],["msg","⌯⌲","Сообщения"],["colors",SQ,"Цвета"],["me","👤","Профиль"]];
function go(t,u){clearInterval(pollT);document.body.className=(t==="me"||t==="user")?"prof":"";tab=t;viewUser=u||null;
 app.innerHTML=`<header><span>Aegis</span><span class="m" style="font-size:15px;font-weight:600;cursor:pointer" id="bal">₳ ${Number(me.balance||0).toLocaleString("ru")}</span></header><div id="v"></div>`+
 `<nav>${TABS.map(x=>`<button data-t="${x[0]}" class="${(tab==x[0]||(tab=="user"&&x[0]=="me"&&viewUser==me.id)||(tab=="chat"&&x[0]=="msg"))?"on":""}"><b>${x[1]}</b>${x[2]}</button>`).join("")}</nav>`;
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
 $("#bal").onclick=()=>go("me");
 ({chat:()=>chatView(viewUser),market:marketView,feed:()=>feedView(),trends:trendsView,me:()=>profileView(me.id),user:()=>profileView(viewUser),
   msg:msgView,
   colors:colorsView})[tab]();
 window.scrollTo(0,0)
}
const soon=(t,d)=>$("#v").innerHTML=`<div class="card"><h2 style="margin:0 0 6px">${t}</h2><p class="m">${d}</p><p><b>Скоро</b></p></div>`;

// ===== Посты =====
const SEL="*, author:profiles!user_id(id,username,avatar_url,verified,badge), color:user_colors(id,name,hex,gradient), likes(user_id), comments(id), reposts(user_id), saves(user_id)";
async function fetchPosts(q){
 try{const{data,error}=await q;if(error)throw error;return arr(data)}catch(e){lastErr=e.message||String(e);return null}
}
function postHTML(p){
 const a=p.author||{},likes=arr(p.likes),mine=likes.some(l=>l.user_id==me.id),rp=arr(p.reposts).some(l=>l.user_id==me.id),sv=arr(p.saves).some(l=>l.user_id==me.id);
 return `<article class="post" data-id="${p.id}">${`<div onclick="go('user','${a.id}')" style="cursor:pointer">${ava(a)}</div>`}<div>
 <div><span class="u" onclick="go('user','${a.id}')">${esc(a.username||"удалён")}</span>${tag(a)} <span class="m">· ${ago(p.created_at)}</span></div>
 ${p.is_private?`<div class="lock" data-lock="${p.id}">🔒 Приватный пост · ₳${fmt(p.price)}${a.id==me.id?"":' <button class="b sm" data-a="buy" style="margin-left:8px">Открыть</button>'}</div>`:(p.content?`<div class="txt">${esc(p.content)}</div>`:"")+(p.image_url?`<img class="pimg" loading="lazy" src="${esc(p.image_url)}" alt="">`:"")}${p.color?`<div class="pcol"><i style="background:${esc(cbg(p.color))}"></i><div><b>${esc(p.color.name)}</b><br><span class="m">${esc(p.color.hex)}</span></div></div>`:""}
 <div class="act"><button data-a="like" class="${mine?"on":""}">${mine?"\u2665\uFE0E":"\u2661"} ${likes.length}</button><button data-a="cm">💬 ${arr(p.comments).length}</button>
 <button data-a="repost" class="${rp?"on":""}">🔄 ${arr(p.reposts).length}</button><button data-a="save" class="${sv?"on":""}">${sv?"⛊":"⛉"} ${Number(p.saves_count)||0}</button>
 ${a.id==me.id?'<button data-a="del">✕</button>':""}</div><div class="cmbox"></div></div></article>`
}
function bindPosts(root){
 root.querySelectorAll(".post").forEach(el=>{
  const id=el.dataset.id;
  el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(el,id,b.dataset.a));
 });
 hydratePrivate(root)
}
async function hydratePrivate(root){
 const els=[...root.querySelectorAll("[data-lock]")];if(!els.length)return;
 try{
  const{data,error}=await sb.from("post_private").select("post_id,content,image_path").in("post_id",els.map(e=>e.dataset.lock));if(error)throw error;
  for(const row of arr(data)){
   const el=root.querySelector(`[data-lock="${row.post_id}"]`);if(!el)continue;
   let img="";if(row.image_path){const u=await sb.storage.from("private-posts").createSignedUrl(row.image_path,3600);if(u.data?.signedUrl)img=`<img class="pimg" loading="lazy" src="${esc(u.data.signedUrl)}" alt="">`}
   el.outerHTML=(row.content?`<div class="txt">${esc(row.content)}</div>`:"")+img
  }
 }catch(e){}
}
const TBL={like:"likes",repost:"reposts",save:"saves"};
async function act(el,id,a){
 const k=id+a;if(busy.has(k))return;busy.add(k);
 try{
  if(TBL[a]){
   const t=TBL[a],on=el.querySelector(`[data-a=${a}]`).classList.contains("on");
   const r=on?await sb.from(t).delete().eq("post_id",id).eq("user_id",me.id):await sb.from(t).upsert({post_id:id,user_id:me.id},{onConflict:"post_id,user_id",ignoreDuplicates:true});
   if(r.error)throw r.error;
   const{data}=await sb.from("posts").select(SEL).eq("id",id).single();
   if(data){const w=document.createElement("div");w.innerHTML=postHTML(data);const n=w.firstElementChild;el.replaceWith(n);bindPosts(n.parentNode)}
  }else if(a=="del"){
   if(!confirm("Удалить публикацию?"))return;
   const r=await sb.from("posts").delete().eq("id",id);if(r.error)throw r.error;el.remove()
  }else if(a=="buy"){
   if(!confirm("Купить доступ к посту? AGS будут списаны."))return;
   const r=await sb.rpc("aegis_buy_post",{p_post:id});if(r.error)return toast(errText(r.error.message));
   await refreshMe();await hydratePrivate(el)
  }else if(a=="cm")toggleComments(el,id)
 }catch(e){toast("Не удалось выполнить действие")}finally{busy.delete(k)}
}

 else{const ow=cols.filter(c=>c.owner_id===id);if(ow.length)cb=`<div class="m">Цвета</div>${mkc(ow)}`}
 const others=allNames.map(n=>n.username).filter(n=>n.toLowerCase()!==p.username.toLowerCase());
 v.innerHTML=`<div class="ban" ${p.banner_url?`style="background-image:url('${esc(p.banner_url)}')"`:""}></div><div class="c" style="padding:0 0 4px">${ava(p,"big")}
 <h2 class="pt"><span data-un="${esc(p.username)}" style="cursor:pointer">@${esc(p.username)}</span>${tag(p)}</h2>
 ${others.length?`<div class="m" style="margin-top:2px">${others.map(n=>`<span data-un="${esc(n)}" style="cursor:pointer">@${esc(n)}</span>`).join(" · ")}</div>`:""}
 <p class="m" style="margin:4px 0">${esc(p.bio||"")}</p>
 <p><b id="frc">${fr}</b> <span class="m">подписчиков</span> · <b>${fg}</b> <span class="m">подписок</span></p>
 ${own?'<button class="b o" id="ed">Редактировать</button>':`<div class="row" style="justify-content:center"><button class="b" id="fl">${following?"Отписаться":"Подписаться"}</button><button class="b o" id="wm">Написать</button></div>`}</div>
 ${cb}${own?'<div id="own"></div>':""}<div id="tabs"><button class="b" data-k="p">Публикации</button>${own?'<button class="b o" data-k="s">Сохранённое</button>':""}<button class="b o" data-k="r">Репосты</button></div><div id="list"></div>`;
 async function list(k){
  const l=$("#list");l.innerHTML='<div class="empty">Загрузка…</div>';
  let d;
  if(k=="p")d=await fetchPosts(sb.from("posts").select(SEL).eq("user_id",id).order("created_at",{ascending:false}).limit(30));
  else{const t=k=="s"?"saves":"reposts";const ids=await fetchPosts(sb.from(t).select("post_id").eq("user_id",id).limit(30));
   d=ids===null?null:ids.length?await fetchPosts(sb.from("posts").select(SEL).in("id",ids.map(x=>x.post_id))):[]}
  if(d===null)return l.innerHTML='<div class="empty">Не удалось загрузить</div>';
  l.innerHTML=d.length?d.map(postHTML).join(""):'<div class="empty">Здесь пока ничего нет</div>';bindPosts(l)
 }
 document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tabs button").forEach(x=>x.className="b o");b.className="b";list(b.dataset.k)});
 list("p");
 if(!own)$("#wm").onclick=()=>go("chat",id);
 if(!own)$("#fl").onclick=async()=>{const b=$("#fl");if(b.disabled)return;b.disabled=true;
  const r=following?await sb.from("follows").delete().eq("follower_id",me.id).eq("following_id",id):await sb.from("follows").upsert({follower_id:me.id,following_id:id},{ignoreDuplicates:true});
  b.disabled=false;if(r.error)return toast("Не удалось выполнить действие");
  following=!following;b.textContent=following?"Отписаться":"Подписаться";$("#frc").textContent=await cnt("following_id")};
 if(own){
  $("#ed").onclick=()=>{$("#own").innerHTML=`<div class="card"><label class="m">Шапка (JPG, PNG, WebP, до 8 МБ)</label><input type="file" id="fb" accept="image/jpeg,image/png,image/webp"><label class="m">Аватар (JPG, PNG, WebP, до 8 МБ)</label><input type="file" id="f" accept="image/jpeg,image/png,image/webp"><label class="m">Описание</label><textarea id="bio" rows="3" maxlength="160">${esc(p.bio||"")}</textarea><div class="err" id="e"></div><button class="b" id="sv">Сохранить</button></div>`;
   $("#sv").onclick=async()=>{const e=$("#e"),btn=$("#sv");e.textContent="";btn.disabled=true;
    const up=async(f,name)=>{
     if(!f)return null;
     if(!["image/jpeg","image/png","image/webp"].includes(f.type))throw new Error("Только JPG, PNG или WebP");
     if(f.size>8*1048576)throw new Error("Файл больше 8 МБ");
     const path=`${me.id}/${name}-${Date.now()}`;
     const u=await sb.storage.from("avatars").upload(path,f,{contentType:f.type});
     if(u.error)throw new Error("Не удалось загрузить фото: "+u.error.message+" (создан ли бакет avatars и выполнен ли aegis_patch.sql?)");
     return sb.storage.from("avatars").getPublicUrl(path).data.publicUrl};
    try{
     const av=await up($("#f").files[0],"avatar"),bn=await up($("#fb").files[0],"banner");
     const upd={bio:$("#bio").value.trim()};if(av)upd.avatar_url=av;if(bn)upd.banner_url=bn;
     const r=await sb.from("profiles").update(upd).eq("id",me.id).select(PC).single();
     if(r.error)throw new Error("Не удалось сохранить: "+r.error.message+" (выполнен ли aegis_patch.sql?)");
     me={...me,...r.data};toast("Сохранено");go("me")
    }catch(x){e.textContent=x.message;btn.disabled=false}}};
  const isCEO=me.badge==="CEO";
  const names=allNames.length?allNames:[{username:p.username}];
  const myL=(await fetchPosts(sb.from("username_listings").select("id,username,price").eq("seller_id",me.id).eq("status","active")))||[];
  const canAdd=isCEO||names.length<3;
  const vblock=p.verified==="blue"?"":`<div class="card" style="margin-top:14px"><b>Верификация</b><p class="m" style="margin:4px 0 10px">${p.verified?"Синяя галочка — следующий уровень.":"Начните с серебряной. Синяя открывается после неё."}</p>${p.verified?'<button class="b" id="vb">Синяя · 100 000 ₳</button>':'<button class="b" id="vs">Серебряная · 50 000 ₳</button>'}</div>`;
  $("#own").insertAdjacentHTML("afterend",`<div class="card" style="margin-top:14px"><b>Юзернеймы</b> <span class="m">${names.length}${isCEO?"":" из 3"}</span>
   ${names.map(n=>{const act=n.username.toLowerCase()===p.username.toLowerCase(),L=myL.find(x=>x.username.toLowerCase()===n.username.toLowerCase());
    return `<div class="urow"><span><span data-un="${esc(n.username)}" style="cursor:pointer">@${esc(n.username)}</span>${act?' <span class="m">· основной</span>':""}${L?` <span class="m">· ${fmt(L.price)} ₳</span>`:""}</span><span class="row" style="gap:6px">${act?"":`<button class="b o sm" data-u="${esc(n.username)}">Основной</button>`}${names.length>1?(L?`<button class="b o sm" data-c="${L.id}">Снять</button>`:`<button class="b o sm" data-s="${esc(n.username)}">Продать</button>`)+`<button class="b o sm" data-x="${esc(n.username)}">Удалить</button>`:""}</span></div>`}).join("")}
   ${canAdd?`<div class="urow" style="display:block"><input id="nu" maxlength="21" autocapitalize="none" autocorrect="off"><div class="err" id="ue"></div><button class="b" id="ub" style="width:100%">${isCEO?"Добавить":"Купить за 1 000 ₳"}</button></div>`:'<p class="m" style="margin:8px 0 0">Достигнут лимит: 3 юзернейма.</p>'}<button class="b o" id="mk" style="width:100%;margin-top:10px">Рынок юзернеймов</button></div>
   ${vblock}
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b o" id="th">Тема</button><button class="b o" id="lo">Выйти</button><button class="b o" id="dl">Удалить аккаунт</button></div>`);
  const refresh=async()=>{const x=await sb.from("profiles").select(PC).eq("id",me.id).single();if(x.data)me=x.data;go("me")};
  const buy=l=>async()=>{if(!confirm("Списать AGS и выдать галочку?"))return;const r=await sb.rpc("aegis_buy_verification",{p_level:l});
   if(r.error)return toast(/balance/i.test(r.error.message)?"Недостаточно AGS":"Покупка недоступна");await refresh()};
  if($("#vs"))$("#vs").onclick=buy("silver");if($("#vb"))$("#vb").onclick=buy("blue");
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{const r=await sb.rpc("aegis_set_username",{p_username:b.dataset.u});if(r.error)return toast("Не удалось сменить юзернейм");await refresh()});
  $("#mk").onclick=()=>go("market");
  const run=(fn,args,ok)=>async()=>{const r=await sb.rpc(fn,args);if(r.error)return toast(errText(r.error.message));if(ok)toast(ok);await refresh()};
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{if(confirm("Удалить юзернейм @"+b.dataset.x+"? Его сможет занять другой пользователь."))run("aegis_delete_username",{p_username:b.dataset.x},"Юзернейм удалён")()});
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const v=prompt("Цена продажи @"+b.dataset.s+" в AGS (целое число):");if(v===null)return;const n=Number(String(v).replace(/\s/g,""));if(!Number.isInteger(n)||n<1)return toast("Укажите целую цену от 1 ₳");run("aegis_list_username",{p_username:b.dataset.s,p_price:n},"Выставлено на продажу")()});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=run("aegis_cancel_listing",{p_id:b.dataset.c},"Снято с продажи"));
  if($("#nu")){lockAt($("#nu"));$("#ub").onclick=async()=>{const u=$("#nu").value.replace(/^@+/,""),e=$("#ue");e.textContent="";
   if(!okName(u))return e.textContent="3–20 символов: латиница, цифры и _";
   if(!isCEO&&!confirm("Списать 1 000 ₳ за юзернейм @"+u+"?"))return;
   $("#ub").disabled=true;const r=await sb.rpc("aegis_buy_username",{p_username:u});$("#ub").disabled=false;
   if(r.error){const m=r.error.message;return e.textContent=/taken/.test(m)?"Этот юзернейм занят":/limit/.test(m)?"Максимум 3 юзернейма":/balance/.test(m)?"Недостаточно AGS":"Не удалось добавить: "+m}
   toast("Юзернейм добавлен");await refresh()}}
  $("#th").onclick=()=>{const d=document.documentElement;d.dataset.t=(d.dataset.t=="dark"||(!d.dataset.t&&matchMedia("(prefers-color-scheme:dark)").matches))?"light":"dark"};
  $("#lo").onclick=()=>{me=null;sb.auth.signOut()};
  $("#dl").onclick=async()=>{if(!confirm("Удалить аккаунт? Это может быть необратимо."))return;if(prompt("Введите ваш юзернейм для подтверждения (@"+me.username+")").replace(/^@/,"")!==me.username)return;
   const r=await sb.functions.invoke("aegis-delete-account");if(r.error)return toast("Удаление недоступно: функция не развёрнута");me=null;await sb.auth.signOut()}
 }
}
loadMe();
</script></body></html>
